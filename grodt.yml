name: grodt
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pandas=1.3.5
  - pandas_market_calendars=4.6.1
  - numpy==1.23.5
  - scipy
  - matplotlib
  - scikit-learn
  - jupyterlab
  - ipykernel
  - ta-lib
  - loguru
  - structlog
  - websockets
  - plotly
  - pip:
      - jenkspy
      - polygon-api-client
      - scikit-optimize
      - twirp==0.0.7
      - protobuf==5.29.3
      - python-dotenv
      - psycopg2-binary
      # pandas-ta removed from PyPI — install separately from local tarball (see Dockerfile.base)
