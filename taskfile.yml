version: '3'

tasks:
  clean:vultr:
    cmds:
      - './cleanup_docker_images_remote.sh'
    dir: "{{.ROOT_DIR}}"

  clean:docker:
    cmds:
      - './cleanup_old_docker_images.sh'
      - 'docker volume prune -f'
    dir: "{{.ROOT_DIR}}"

  env:generate:
    cmds:
      - 'rm -f .env.machine'
      - 'touch .env.machine'
      - 'echo TRADING_PROJECT_DIR=\"{{.ROOT_DIR}}\" >> .env.machine'
      - 'echo ANACONDA_HOME=\"$(conda info --base)\" >> .env.machine'
    dir: "{{.ROOT_DIR}}"

  conda:activate:
    cmds:
      - 'conda activate grodt'
    dir: "{{.ROOT_DIR}}"

  conda:init:
    cmds:
      - 'task env:generate'
      - 'rm -f miniconda3'
      - 'ln -s $(conda info --base) miniconda3'
    dir: "{{.ROOT_DIR}}"

  conda:create:
    cmds:
      - 'conda env create -f grodt.yml'
    dir: "{{.ROOT_DIR}}"

  conda:list:
    cmds:
      - 'conda env list'

  conda:update:
    cmds:
      - 'conda env update -f grodt.yml --name trading --prune'
    dir: "{{.ROOT_DIR}}"

  conda:export:
    cmds:
      - 'conda update --all'
      - 'conda env export > conda-env-trading.yaml'
    dir: "{{.ROOT_DIR}}"

  list:
    cmds:
      - 'task --list-all'

  rc:
    cmds:
      - 'mosh root@149.28.225.5'

  python:install:
    cmds:
      - 'rm -rf env'
      - 'python3.10 -m venv env'
      - 'task python:upgrade'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  python:upgrade:
    cmds:
      - 'pip install --upgrade pip'
      - 'pip install -r requirements.txt'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  test:
    cmds:
      - 'go test -count=1 ./...'
    dir: src/go/backtester-api
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:e2e:
    cmds:
      - task app:build-dev
      - task test:e2e:live-account-cancel-order
      - task test:e2e:live-account-close-duplicate-canceled
      - task test:e2e:live-account-close-duplicate-rejected
      - task test:e2e:live-account-close
      - task test:e2e:live-account-close-with-id
      - task test:e2e:live-account-duplicate-orders
      - task test:e2e:live-account-filled
      - task test:e2e:live-account-get-open-orders
      - task test:e2e:live-account-multiple-open-rejected
      - task test:e2e:live-account-multiple-open
      - task test:e2e:live-account-multiple-playgrounds
      - task test:e2e:live-account-reject-order
      - task test:e2e:simulate-options
      - task test:e2e:live-account-simulate-options
      - task test:e2e:trace-id
      - task test:e2e:otel-candle-metrics
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:otel-candle-metrics:
    cmds:
      - 'go test -tags integration -timeout 180s -v -count=1 -run ^TestLiveCandleMetricPipeline$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:tradier-place-spread:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestTradierPlaceSpread$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-simulate-options:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-get-open-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountGetOpenOrders$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-multiple-open-rejected:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountMultipleOpenRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-with-id:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCloseWithID$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-filled:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountFilled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountClose$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"
  
  test:e2e:live-account-multiple-playgrounds:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountMultiplePlaygrounds$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-duplicate-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountDuplicateOrdersTest$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-duplicate-rejected:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-duplicate-canceled:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateCanceled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-multiple-open:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountMultipleOpen$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing" 

  test:e2e:live-account-reject-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountRejectOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing" 

  test:e2e:live-account-cancel-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCancelOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"
  
  test:e2e:simulate-options:
    cmds:
      - 'go test -timeout 60s -v -count=1 -run ^TestSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:trace-id:
    cmds:
      - 'go test -tags integration -timeout 120s -v -count=1 -run ^TestTraceId github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  metrics:token:
    cmds:
      - 'kubectl -n kubernetes-dashboard create token --duration=24h dashboard-admin'

  test:integration:
    cmds:
      # - 'go run main.go'
      - 'go test ./...'
    dir: "{{.ROOT_DIR}}/src/go/eventservices/integration_tests"

  commit:
    cmds:
      - 'task test'
      - 'git add .'
      - 'git commit -m "{{.CLI_ARGS}}"'
      - 'git push'
      
  app:dev:
    cmds:
      - './run-dev.sh'
    dir: cmd

  app:build:
    cmds:
      - 'docker build -t grodt/app:latest -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"

  app:logs:
    cmds:
      - 'stern grodt --container-state running'

  app:restart:
    cmds:
      - 'task app:stop'
      - 'task app:start'

  app:stop:
    cmds:
      - 'kubectl scale deployment grodt --replicas=0'

  app:update:
    cmds:
      - 'kubectl rollout restart deployment grodt'

  app:start:
    cmds:
      - 'kubectl scale deployment grodt --replicas=1'

  app:build-dev:
    cmds:
      - 'docker build -t grodt/app:latest-dev -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"
      
  app:deploy:
    cmds:
      - './deploy-app.sh {{.version}}'
    dir: "{{.ROOT_DIR}}"
    var:
      version: ""

  metrics:simulation:
    cmds:
      - '/Users/jamal/miniconda3/envs/trading/bin/python3 engine/trading_engine.py --sl-shift 1'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      BALANCE: "10000"
      SYMBOL: "NVDA"
      TWIRP_HOST: "http://45.77.223.21"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_open_strategy_v4"
      START_DATE: "2025-05-01"
      STOP_DATE: "2025-05-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      
  metrics:fetch:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://45.77.223.21 --from-date 2025-05-29 --to-date 2025-05-30'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:simulation:
    cmds:
        - './env/bin/python tools/playground_metrics.py --playground-id b2df3e33-b684-4d5e-b6d1-9d67f29f45cb --twirp-host http://localhost:5051 --from-date 2025-05-27 --to-date 2025-05-29'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:local:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://localhost:5051 --from-date 2025-05-16 --to-date 2025-05-17'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  esdb:pf:
    cmds:
      - 'kubectl port-forward svc/eventstoredb 2113:2113 -n eventstoredb'

  pg:pf:
    cmds:
      - 'kubectl port-forward svc/postgres 5432:5432 -n database'

  db:start:
    cmds:
      - 'docker-compose -f {{.ROOT_DIR}}/infra/docker-compose.yaml up'

  observability:start:
    desc: "Start observability stack (Grafana, Tempo, Loki, Prometheus, OTel Collector)"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml up -d'
    dir: "{{.ROOT_DIR}}"

  observability:stop:
    desc: "Stop observability stack"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml down'
    dir: "{{.ROOT_DIR}}"

  observability:logs:
    desc: "Show observability stack logs"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml logs -f'
    dir: "{{.ROOT_DIR}}"

  infra:status:
    desc: "Check production droplet status via DO MCP"
    cmds:
      - 'echo "Use DO MCP server: list droplets with tag grodt"'
      - 'echo "Or: doctl compute droplet list --tag-name grodt"'

  infra:destroy:
    desc: "Destroy production droplet and firewall (WARNING: destructive)"
    cmds:
      - 'echo "Use DO MCP server to destroy:"'
      - 'echo "  1. Delete droplet named grodt-prod"'
      - 'echo "  2. Delete firewall named grodt-prod-firewall"'
      - 'echo "Or: doctl compute droplet delete grodt-prod --force"'
      - 'echo "    doctl compute firewall delete <firewall-id>"'

  infra:rebuild:
    desc: "Destroy and reprovision production stack from scratch"
    cmds:
      - task infra:destroy
      - 'echo "Run /gsd:execute-phase 7 --wave 2 to reprovision via MCP"'

  infra:deploy:
    desc: "Deploy latest code to production droplet"
    cmds:
      - 'ssh root@$(doctl compute droplet get grodt-prod --format PublicIPv4 --no-header 2>/dev/null || echo "DROPLET_IP") "cd /opt/slack-trading && git pull && docker compose -f docker-compose.prod.yaml up -d --build"'

  infra:logs:
    desc: "Stream production logs from all services"
    cmds:
      - 'ssh root@$(doctl compute droplet get grodt-prod --format PublicIPv4 --no-header 2>/dev/null || echo "DROPLET_IP") "cd /opt/slack-trading && docker compose -f docker-compose.prod.yaml logs -f"'

  gen:proto:
    cmds:
      - 'source {{.ROOT_DIR}}/src/clients/python/env/bin/activate'
      - 'protoc --proto_path={{.ROOT_DIR}}/src/go --go_out={{.ROOT_DIR}} --python_out={{.ROOT_DIR}}/src/clients/python --twirp_out={{.ROOT_DIR}} --twirpy_out={{.ROOT_DIR}}/src/clients/python {{.ROOT_DIR}}/src/go/playground.proto'
      - 'mv {{.ROOT_DIR}}/playground/playground.pb.go {{.ROOT_DIR}}/src/go/playground'
      - 'mv {{.ROOT_DIR}}/playground/playground.twirp.go {{.ROOT_DIR}}/src/go/playground'
      - 'rm -rf {{.ROOT_DIR}}/playground'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_pb2.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_twirp.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_pb2.py'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_twirp.py'

  optimize:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine_optimizer.py --max-open-count-lbound 2 --max-open-count-ubound 8 --target-risk-to-reward-lbound 0.8 --target-risk-to-reward-ubound 2.5 --max-per-trade-risk-percentage-lbound 0.005 --max-per-trade-risk-percentage-ubound 0.035 --n-calls 25'
    env:
      BALANCE: "15000"
      SYMBOL: "{{.SYMBOL}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      LIVE_ACCOUNT_TYPE: "simulation"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "25"
    vars:
      SYMBOL: ""

  sim:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine.py --max-open-count 4 --target-risk-to-reward 1.19 --max-per-trade-risk-percentage 0.02 --use-htf-data true'
    env:
      BALANCE: "20000"
      SYMBOL: "{{.symbol}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      REMOVE_PLAYGROUND_WHEN_DONE: "false"
    vars:
      symbol: ""
    dir: "{{.ROOT_DIR}}"

  # ─── V2 Strategy Commands (TradeSignal Framework) ──────────────────

  strategy:mean-reversion:
    desc: "Run MeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --balance {{.BALANCE}} {{if .PDF_PATH}}--pdf-path {{.PDF_PATH}}{{end}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://159.89.226.131:4318"
      OTEL_SERVICE_NAME: "grodt-strategy"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      BALANCE: '{{.balance | default (.BALANCE | default "100000")}}'
      PDF_PATH: '{{.pdf_path | default (.PDF_PATH | default "")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:live:
    desc: "Run MeanReversion V2 strategy in live mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --live --client-id {{.CLIENT_ID}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://159.89.226.131:4318"
      OTEL_SERVICE_NAME: "grodt-strategy"
      TWIRP_HOST: "http://159.89.226.131:5051"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      CLIENT_ID: '{{.client_id | default (.CLIENT_ID | default (print "live-mean-reversion-" .SYMBOL))}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:replay:
    desc: "Run MeanReversion V2 with signal replay from ESDB (requires stream name)"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --replay-signals {{.STREAM}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      STREAM: '{{.stream | default (.STREAM | default "")}}'
    preconditions:
      - sh: '[ -n "{{.STREAM}}" ]'
        msg: |
          stream is required.
          task strategy:mean-reversion:replay stream=trade-signals
          task strategy:mean-reversion:replay stream=trade-signals-sim-<playground-id>

  strategy:mean-reversion:save:
    desc: "Run MeanReversion V2 and save results to Postgres"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --save-to-db --client-id {{.CLIENT_ID}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      CLIENT_ID: '{{.client_id | default (.CLIENT_ID | default (print "backtest-" .SYMBOL "-" .START))}}'

  strategy:covered-call:
    desc: "Run CoveredCall V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_covered_call_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:credit-spread:
    desc: "Run CreditSpread V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_credit_spread_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "SPY")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:wheel:
    desc: "Run Wheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:options-mean-reversion:
    desc: "Run OptionsMeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_options_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:pdf-wheel:
    desc: "Run PDFWheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python demos/demo_pdf_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  build:pdf:
    desc: "Build PDF from Polygon data (e.g. task build:pdf symbol=AAPL start=2025-03-01 end=2025-03-31)"
    cmds:
      - 'PYTHONPATH=. /Users/jamal/miniconda3/envs/grodt/bin/python tools/build_pdf_from_polygon.py --strategy {{.STRATEGY}} --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --output {{.OUTPUT}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      STRATEGY: '{{.strategy | default (.STRATEGY | default "mean_reversion")}}'
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      OUTPUT: '{{.output | default (.OUTPUT | default (print "models/" .SYMBOL "_" .STRATEGY "_" .START "_" .END "_pdf.json"))}}'

  # ─── Metabase ──────────────────────────────────────────────────────

  metabase:provision:
    desc: "Provision all Metabase dashboards (5 dashboards, 24 cards)"
    cmds:
      - '/Users/jamal/miniconda3/envs/grodt/bin/python infra/provision-metabase.py --url {{.url}} --user {{.user}} --password {{.password}}'
    dir: "{{.ROOT_DIR}}"
    vars:
      url: "http://192.168.8.164:3001"
      user: "jac475@cornell.edu"
      password: ""

  metabase:schema:
    desc: "Apply analytics schema (indexes, views, backtest_runs table)"
    cmds:
      - 'PGPASSWORD={{.password}} psql -h {{.host}} -U grodt -d playground -f infra/analytics-schema.sql'
    dir: "{{.ROOT_DIR}}"
    vars:
      host: "159.89.226.131"
      password: ""