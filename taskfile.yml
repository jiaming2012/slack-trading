version: '3'

tasks:
  clean:vultr:
    cmds:
      - './cleanup_docker_images_remote.sh'
    dir: ${PROJECT_DIR}

  clean:docker:
    cmds:
      - './cleanup_old_docker_images.sh'
      - 'docker volume prune -f'
    dir: ${PROJECT_DIR}

  env:generate:
    cmds:
      - 'rm -f .env.machine'
      - 'touch .env.machine'
      - 'echo PROJECT_DIR=\"${PROJECT_DIR}\" >> .env.machine'
      - 'echo ANACONDA_HOME=\"$(conda info --base)\" >> .env.machine'
    dir: ${PROJECT_DIR}

  conda:activate:
    cmds:
      - 'conda activate grodt'
    dir: ${PROJECT_DIR}

  conda:init:
    cmds:
      - 'task env:generate'
      - 'rm -f miniconda3'
      - 'ln -s $(conda info --base) miniconda3'
    dir: ${PROJECT_DIR}

  conda:create:
    cmds:
      - 'conda env create -f grodt.yml'
    dir: ${PROJECT_DIR}

  conda:list:
    cmds:
      - 'conda env list'

  conda:update:
    cmds:
      - 'conda env update -f grodt.yml --name trading --prune'
    dir: ${PROJECT_DIR}

  conda:export:
    cmds:
      - 'conda update --all'
      - 'conda env export > conda-env-trading.yaml'
    dir: ${PROJECT_DIR}

  list:
    cmds:
      - 'task --list-all'

  rc:
    cmds:
      - 'mosh root@149.28.225.5'

  python:install:
    cmds:
      - 'rm -rf env'
      - 'python3.10 -m venv env'
      - 'task python:upgrade'
    dir: ${PROJECT_DIR}/src/clients/python

  python:upgrade:
    cmds:
      - 'pip install --upgrade pip'
      - 'pip install -r requirements.txt'
    dir: ${PROJECT_DIR}/src/clients/python

  test:
    cmds:
      - 'PROJECT_DIR={{.ROOT_DIR}} go test -count=1 ./...'
    dir: src/go/backtester-api

  test:e2e:
    cmds:
      - task app:build-dev
      - task test:e2e:live-account-cancel-order
      - task test:e2e:live-account-close-duplicate-canceled
      - task test:e2e:live-account-close-duplicate-rejected
      - task test:e2e:live-account-close
      - task test:e2e:live-account-close-with-id
      - task test:e2e:live-account-duplicate-orders
      - task test:e2e:live-account-filled
      - task test:e2e:live-account-get-open-orders
      - task test:e2e:live-account-multiple-open-rejected
      - task test:e2e:live-account-multiple-open
      - task test:e2e:live-account-multiple-playgrounds
      - task test:e2e:live-account-reject-order
      - task test:e2e:simulate-options
      - task test:e2e:live-account-simulate-options
      - task test:e2e:trace-id
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:tradier-place-spread:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestTradierPlaceSpread$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-simulate-options:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-get-open-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountGetOpenOrders$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-multiple-open-rejected:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountMultipleOpenRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-close-with-id:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCloseWithID$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-filled:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountFilled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-close:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountClose$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing
  
  test:e2e:live-account-multiple-playgrounds:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountMultiplePlaygrounds$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-duplicate-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountDuplicateOrdersTest$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-close-duplicate-rejected:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-close-duplicate-canceled:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateCanceled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:live-account-multiple-open:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountMultipleOpen$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing 

  test:e2e:live-account-reject-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountRejectOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing 

  test:e2e:live-account-cancel-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCancelOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing
  
  test:e2e:simulate-options:
    cmds:
      - 'go test -timeout 60s -v -count=1 -run ^TestSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  test:e2e:trace-id:
    cmds:
      - 'go test -tags integration -timeout 120s -v -count=1 -run ^TestTraceId github.com/jiaming2012/slack-trading/integration_testing'
    dir: ${PROJECT_DIR}/integration_testing

  metrics:token:
    cmds:
      - 'kubectl -n kubernetes-dashboard create token --duration=24h dashboard-admin'

  test:integration:
    cmds:
      # - 'go run main.go'
      - 'go test ./...'
    dir: ${PROJECT_DIR}/src/go/eventservices/integration_tests

  commit:
    cmds:
      - 'task test'
      - 'git add .'
      - 'git commit -m "{{.CLI_ARGS}}"'
      - 'git push'
      
  app:dev:
    cmds:
      - './run-dev.sh'
    dir: cmd

  app:build:
    cmds:
      - 'docker build -t ewr.vultrcr.com/grodt/app:latest -f Dockerfile .'
    dir: ${PROJECT_DIR}

  app:logs:
    cmds:
      - 'stern grodt --container-state running'

  app:restart:
    cmds:
      - 'task app:stop'
      - 'task app:start'

  app:stop:
    cmds:
      - 'kubectl scale deployment grodt --replicas=0'

  app:update:
    cmds:
      - 'kubectl rollout restart deployment grodt'

  app:start:
    cmds:
      - 'kubectl scale deployment grodt --replicas=1'

  app:build-dev:
    cmds:
      - 'docker build -t ewr.vultrcr.com/grodt/app:latest-dev -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"
      
  app:deploy:
    cmds:
      - './deploy-app.sh {{.version}}'
    dir: "{{.ROOT_DIR}}"
    var:
      version: ""

  metrics:simulation:
    cmds:
      - '/Users/jamal/miniconda3/envs/trading/bin/python3 engine/trading_engine.py --sl-shift 1'
    dir: ${PROJECT_DIR}/src/clients/python
    env:
      BALANCE: "10000"
      SYMBOL: "NVDA"
      TWIRP_HOST: "http://45.77.223.21"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_open_strategy_v4"
      START_DATE: "2025-05-01"
      STOP_DATE: "2025-05-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      
  metrics:fetch:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://45.77.223.21 --from-date 2025-05-29 --to-date 2025-05-30'
    dir: ${PROJECT_DIR}/src/clients/python
    var:
      tags: ""

  metrics:fetch:simulation:
    cmds:
        - './env/bin/python tools/playground_metrics.py --playground-id b2df3e33-b684-4d5e-b6d1-9d67f29f45cb --twirp-host http://localhost:5051 --from-date 2025-05-27 --to-date 2025-05-29'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:local:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://localhost:5051 --from-date 2025-05-16 --to-date 2025-05-17'
    dir: ${PROJECT_DIR}/src/clients/python
    var:
      tags: ""

  esdb:pf:
    cmds:
      - 'kubectl port-forward svc/eventstoredb 2113:2113 -n eventstoredb'

  pg:pf:
    cmds:
      - 'kubectl port-forward svc/postgres 5432:5432 -n database'

  db:start:
    cmds:
      - 'docker-compose -f ${PROJECT_DIR}/eventstoredb/docker-compose.yaml up'

  observability:start:
    desc: "Start observability stack (Grafana, Tempo, Loki, Prometheus, OTel Collector)"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml up -d'
    dir: ${PROJECTS_DIR}/slack-trading

  observability:stop:
    desc: "Stop observability stack"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml down'
    dir: ${PROJECTS_DIR}/slack-trading

  observability:logs:
    desc: "Show observability stack logs"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml logs -f'
    dir: ${PROJECTS_DIR}/slack-trading

  gen:proto:
    cmds:
      - 'source ${PROJECT_DIR}/src/clients/python/env/bin/activate'
      - 'protoc --proto_path=${PROJECT_DIR}/src/go --go_out=${PROJECT_DIR} --python_out=${PROJECT_DIR}/src/clients/python --twirp_out=${PROJECT_DIR} --twirpy_out=${PROJECT_DIR}/src/clients/python ${PROJECT_DIR}/src/go/playground.proto'
      - 'mv ${PROJECT_DIR}/playground/playground.pb.go ${PROJECT_DIR}/src/go/playground'
      - 'mv ${PROJECT_DIR}/playground/playground.twirp.go ${PROJECT_DIR}/src/go/playground'
      - 'rm -rf ${PROJECT_DIR}/playground'
      - 'mv ${PROJECT_DIR}/src/clients/python/playground_pb2.py ${PROJECT_DIR}/src/clients/python/rpc'
      - 'mv ${PROJECT_DIR}/src/clients/python/playground_twirp.py ${PROJECT_DIR}/src/clients/python/rpc'
      - 'rm -rf ${PROJECT_DIR}/src/clients/python/playground_pb2.py'
      - 'rm -rf ${PROJECT_DIR}/src/clients/python/playground_twirp.py'

  optimize:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine_optimizer.py --max-open-count-lbound 2 --max-open-count-ubound 8 --target-risk-to-reward-lbound 0.8 --target-risk-to-reward-ubound 2.5 --max-per-trade-risk-percentage-lbound 0.005 --max-per-trade-risk-percentage-ubound 0.035 --n-calls 25'
    env:
      BALANCE: "15000"
      SYMBOL: "{{.SYMBOL}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      LIVE_ACCOUNT_TYPE: "simulation"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "25"
    vars:
      SYMBOL: ""

  sim:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine.py --max-open-count 4 --target-risk-to-reward 1.19 --max-per-trade-risk-percentage 0.02 --use-htf-data true'
    env:
      BALANCE: "20000"
      SYMBOL: "{{.symbol}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      REMOVE_PLAYGROUND_WHEN_DONE: "false"
    vars:
      symbol: ""
    dir: ${PROJECT_DIR}