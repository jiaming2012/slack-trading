  db:partition:ensure:
    desc: 'Provision monthly partitions (current month + horizon) for scan_results and sim_outcomes'
    cmds:
      - 'go run ./cmd/tradingstack-db partition-ensure'
    dir: "{{.ROOT_DIR}}"

  db:retention:dry-run:
    desc: 'Report which scan_results/sim_outcomes partitions are eligible for archival, without acting'
    cmds:
      - 'go run ./cmd/tradingstack-db retention-dry-run'
    dir: "{{.ROOT_DIR}}"

  db:retention:run:
    desc: 'Detach eligible scan_results/sim_outcomes partitions and hand each to the (stub) cold-storage archiver'
    cmds:
      - 'go run ./cmd/tradingstack-db retention-run'
    dir: "{{.ROOT_DIR}}"

  optimizer:validate:
    desc: 'Run the optimizer validation pipeline self-check (synthetic fixtures, no DB required)'
    cmds:
      - 'go run ./cmd/optimizer-validate'
    dir: "{{.ROOT_DIR}}"

  optimizer:overfitting-check:
    desc: 'Run the shared optimizer overfitting gate self-check over built-in passing and failing synthetic fixtures (no DB required). Exits non-zero only on internal error; the failing fixture verdict is the expected demonstration.'
    cmds:
      - 'go run ./cmd/overfitting-check'
    dir: "{{.ROOT_DIR}}"

  test:overfitting:
    desc: 'Run the overfitting gate package unit and testcontainers persistence suite (requires Docker)'
    cmds:
      - 'go test -count=1 ./src/go/tradingstack/overfitting/...'
    dir: "{{.ROOT_DIR}}"
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:net-ev-cost-model:
    desc: 'Run the costmodel package unit and testcontainers migration suite (requires Docker)'
    cmds:
      - 'go test -count=1 ./src/go/tradingstack/costmodel/...'
    dir: "{{.ROOT_DIR}}"
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"
  test:e2e:
    cmds:
