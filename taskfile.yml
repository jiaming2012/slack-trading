version: '3'

vars:
  CONDA_BASE:
    sh: conda info --base
  PYTHON: '{{.CONDA_BASE}}/envs/grodt/bin/python'

tasks:
  clean:vultr:
    cmds:
      - './cleanup_docker_images_remote.sh'
    dir: "{{.ROOT_DIR}}"

  clean:docker:
    cmds:
      - './cleanup_old_docker_images.sh'
      - 'docker volume prune -f'
    dir: "{{.ROOT_DIR}}"

  env:generate:
    cmds:
      - 'rm -f .env.machine'
      - 'touch .env.machine'
      - 'echo TRADING_PROJECT_DIR=\"{{.ROOT_DIR}}\" >> .env.machine'
      - 'echo ANACONDA_HOME=\"$(conda info --base)\" >> .env.machine'
    dir: "{{.ROOT_DIR}}"

  conda:activate:
    cmds:
      - 'conda activate grodt'
    dir: "{{.ROOT_DIR}}"

  conda:init:
    cmds:
      - 'task env:generate'
      - 'rm -f miniconda3'
      - 'ln -s $(conda info --base) miniconda3'
    dir: "{{.ROOT_DIR}}"

  conda:create:
    cmds:
      - 'conda env create -f grodt.yml'
    dir: "{{.ROOT_DIR}}"

  conda:list:
    cmds:
      - 'conda env list'

  conda:update:
    cmds:
      - 'conda env update -f grodt.yml --name trading --prune'
    dir: "{{.ROOT_DIR}}"

  conda:export:
    cmds:
      - 'conda update --all'
      - 'conda env export > conda-env-trading.yaml'
    dir: "{{.ROOT_DIR}}"

  list:
    cmds:
      - 'task --list-all'

  rc:
    cmds:
      - 'mosh root@149.28.225.5'

  python:install:
    cmds:
      - 'rm -rf env'
      - 'python3.10 -m venv env'
      - 'task python:upgrade'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  python:upgrade:
    cmds:
      - 'pip install --upgrade pip'
      - 'pip install -r requirements.txt'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  test:
    cmds:
      - 'go test -count=1 ./...'
    dir: src/go/backtester
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:migrate-crossed-enums:
    desc: 'migrate-crossed-enums G4 companion (MIG-03 pattern): verify the mode round-trip — every legacy (environment, live_account_type) combination maps to the expected Mode, re-reads idempotently with byte-identical column values, reconcile rows stay internal, and invalid combinations are rejected. Exits non-zero on any mismatch.'
    cmds:
      - go test -count=1 -run 'TestMode|TestAccountRole|TestMetaLegacy|TestMetaUnknownLegacyRowFailsLoad|TestNewMetaConstructionWritesCanonicalLegacyBytes' -v ./models/
      - go test -count=1 -run 'TestCreateLivePlayground_Rejects|TestCreateLivePlayground_ValidCombination|TestCreatePlayground_RejectsNonSimulationEnvironments' -v ./router/
    dir: src/go/backtester
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:model-diff:
    desc: 'MIG-03: run the fixed AAPL model-diff backtester scenario and diff its output byte-for-byte against the committed baseline reference (reconcile-models-packages G4). Requires the Go trading server to be running (task app:dev).'
    cmds:
      - |
        set -eu
        HOST="${TWIRP_HOST:-http://127.0.0.1:5051}"
        HOST_PORT="${HOST#http://}"
        HOST_PORT="${HOST_PORT#https://}"
        HOST_ONLY="${HOST_PORT%%:*}"
        PORT_ONLY="${HOST_PORT##*:}"
        if ! nc -z "$HOST_ONLY" "$PORT_ONLY" 2>/dev/null; then
          echo "ERROR: Go trading server is not reachable at ${HOST}. Start it first: task app:dev" >&2
          exit 1
        fi

        SCENARIO_NAME="aapl-2025-01-06_2025-01-10"
        REFERENCE="{{.ROOT_DIR}}/src/clients/python/tests/baselines/model-diff-reference.txt"
        OUT="$(mktemp)"
        trap 'rm -f "$OUT"' EXIT

        {{.PYTHON}} -m tests.model_diff_scenario --twirp-host "$HOST" --output "$OUT"

        if ! diff -u "$REFERENCE" "$OUT"; then
          echo "" >&2
          echo "test:model-diff FAILED — scenario '${SCENARIO_NAME}' output differs from the baseline reference (${REFERENCE})" >&2
          exit 1
        fi

        echo "test:model-diff PASSED — scenario '${SCENARIO_NAME}' matches the baseline reference byte-for-byte."
    dir: src/clients/python

  test:no-gorm-leaks:
    desc: 'Guard against gorm.DB reappearing on the public database surface: the IDatabaseService interface (src/go/backtester/models/database_service_interface.go) and the exported *DatabaseService method declarations (src/go/data). Package-internal helpers may use gorm freely (close-gorm-db-leaks).'
    cmds:
      - |
        set -u
        FAIL=0

        IFACE_HITS="$(grep -n 'gorm\.DB' src/go/backtester/models/database_service_interface.go 2>/dev/null || true)"
        if [ -n "$IFACE_HITS" ]; then
          echo "GORM LEAK: gorm.DB found on the IDatabaseService interface:" >&2
          echo "$IFACE_HITS" >&2
          FAIL=1
        fi

        METHOD_HITS="$(grep -rnE 'func \([A-Za-z_]+ \*DatabaseService\) [A-Z][A-Za-z0-9_]*\(.*gorm\.DB' --include='*.go' src/go/data 2>/dev/null || true)"
        if [ -n "$METHOD_HITS" ]; then
          echo "GORM LEAK: gorm.DB found in an exported *DatabaseService method signature:" >&2
          echo "$METHOD_HITS" >&2
          FAIL=1
        fi

        if [ "$FAIL" -ne 0 ]; then
          exit 1
        fi

        echo "test:no-gorm-leaks PASSED — no gorm.DB on the public database surface."
    dir: "{{.ROOT_DIR}}"

  test:smoke:
    desc: 'e2e-sim-smoke-test G5 gate: boot the Go server headlessly (dev mode), create a Simulation playground over AAPL 2025 data via Twirp, run a bounded tick loop with one forced order, assert the fill, tear down. Exit 0 = pass. Fails fast if something else already holds Twirp port 5051.'
    cmds:
      - PYTHON="{{.PYTHON}}" ./run_e2e_smoke_test.sh
    dir: src/clients/python

  test:python:
    desc: 'Run the Python client unit suite headlessly (no server required). Excludes the e2e strategy test; the e2e smoke and demo-covered-call integration modules self-skip when their live-server harness is absent. Propagates pytest''s exit code (0 = green).'
    cmds:
      - '{{.PYTHON}} -m pytest tests/ --ignore=tests/test_strategy_e2e.py -q'
    dir: src/clients/python

  test:demo-covered-call:
    desc: 'Covered-call demo regression: boot the Go server headlessly (dev mode), run demos.demo_covered_call end-to-end (AAPL 2025-01-01..2025-03-01, ~10-15 min via Polygon), and validate the pinned reference metrics in tests/test_demo_covered_call.py. Waits (never kills) if something else holds Twirp port 5051; tears down only its own server. Exit 0 = metrics match.'
    cmds:
      - PYTHON="{{.PYTHON}}" ./run_demo_covered_call_test.sh
    dir: src/clients/python

  lint:package-names:
    desc: 'Guard against drift back to the pre-rename-event-packages package names (eventservices, eventconsumers, eventproducers, eventpubsub, backtester-api). Scans live Go source and live architecture docs only -- historical/archival material (.planning/milestones, .planning/todos, openspec/changes/*, todo/, docs/adr/) is intentionally excluded.'
    cmds:
      - |
        set -u
        FAIL=0

        GO_HITS="$(grep -rn 'src/go/eventservices\|src/go/eventconsumers\|src/go/eventproducers\|src/go/eventpubsub\|src/go/backtester-api' --include='*.go' src cmd 2>/dev/null || true)"
        if [ -n "$GO_HITS" ]; then
          echo "STALE PACKAGE REFERENCE(S) found in Go source:" >&2
          echo "$GO_HITS" >&2
          FAIL=1
        fi

        DOC_FILES="{{.ROOT_DIR}}/CLAUDE.md {{.ROOT_DIR}}/.planning/codebase/STRUCTURE.md {{.ROOT_DIR}}/.planning/codebase/ARCHITECTURE.md {{.ROOT_DIR}}/.planning/codebase/CONCERNS.md {{.ROOT_DIR}}/.planning/codebase/INTEGRATIONS.md {{.ROOT_DIR}}/.planning/codebase/TESTING.md {{.ROOT_DIR}}/.planning/codebase/CONVENTIONS.md"
        DOC_HITS="$(grep -n 'eventservices\|eventconsumers\|eventproducers\|eventpubsub\|backtester-api' $DOC_FILES 2>/dev/null || true)"
        if [ -n "$DOC_HITS" ]; then
          echo "STALE PACKAGE REFERENCE(S) found in live docs:" >&2
          echo "$DOC_HITS" >&2
          FAIL=1
        fi

        if [ "$FAIL" -ne 0 ]; then
          exit 1
        fi

        echo "lint:package-names PASSED — no stale references to eventservices, eventconsumers, eventproducers, eventpubsub, or backtester-api found."
    dir: "{{.ROOT_DIR}}"

  test:trading-stack:
    desc: 'Run the tradingstack package testcontainers round-trip suite (requires Docker)'
    cmds:
      - 'go test -count=1 ./src/go/tradingstack/...'
    dir: "{{.ROOT_DIR}}"
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  fidelity:check:
    desc: 'Run the simulator-vs-live fidelity checker (defaults to the built-in synthetic dataset). Exits non-zero only on execution error; a tolerance breach is a normal, reportable outcome.'
    cmds:
      - 'go run ./cmd/fidelity-check {{.CLI_ARGS | default "--synthetic"}}'

  test:ev-tracker:
    desc: 'Run the evtracker EV-computation unit and testcontainers persistence suite (requires Docker)'
    cmds:
      - 'go test -count=1 ./src/go/evtracker/...'

  test:feed-health:
    desc: 'Run the feedhealth package unit tests in isolation (requires Docker for the tagging/migration test)'
    cmds:
      - 'go test -count=1 ./src/go/feedhealth/...'

  test:crowding-detection:
    desc: 'Run the crowding-detection package unit test suite (fixtures only, no Docker required)'
    cmds:
      - 'go test -count=1 ./src/go/tradingstack/crowding/...'

  test:portfolio-risk-overlay:
    desc: 'Run the portfolio risk overlay package unit test suite (fixtures only, no Docker required)'
    cmds:
