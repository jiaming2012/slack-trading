  metrics:token:
    cmds:
      - 'kubectl -n kubernetes-dashboard create token --duration=24h dashboard-admin'

  test:integration:
    cmds:
      # - 'go run main.go'
      - 'go test ./...'
    dir: "{{.ROOT_DIR}}/src/go/marketdata/integration_tests"

  commit:
    cmds:
      - 'task test'
      - 'git add .'
      - 'git commit -m "{{.CLI_ARGS}}"'
      - 'git push'
      
  kill-switch:engage:
    desc: 'Engage the hard kill switch: halt ALL order submission in every Mode. Optional reason via REASON env var. Passes the shared-secret token from KILL_SWITCH_TOKEN (required when the server has one configured). Host override via KILL_SWITCH_HOST (default http://localhost:8080).'
    cmds:
      - |
        set -eu
        HOST="${KILL_SWITCH_HOST:-http://localhost:8080}"
        REASON="${REASON:-manual kill switch engaged via task}"
        curl -sS -X POST "${HOST}/kill-switch/engage" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer ${KILL_SWITCH_TOKEN:-}" \
          -d "{\"reason\": \"${REASON}\"}"
        echo ""

  kill-switch:release:
    desc: 'Release the kill switch and resume order submission. Requires the shared-secret token from KILL_SWITCH_TOKEN (refused fail-closed when the server has none configured). Rejected (409) while an auto-halt still needs acknowledgment — run task kill-switch:acknowledge first. Host override via KILL_SWITCH_HOST.'
    cmds:
      - |
        set -eu
        HOST="${KILL_SWITCH_HOST:-http://localhost:8080}"
        curl -sS -X POST "${HOST}/kill-switch/release" \
          -H "Authorization: Bearer ${KILL_SWITCH_TOKEN:-}"
        echo ""

  kill-switch:acknowledge:
    desc: 'Acknowledge an auto-halt cooldown so it can be released. Requires the shared-secret token from KILL_SWITCH_TOKEN (refused fail-closed when the server has none configured). Host override via KILL_SWITCH_HOST.'
    cmds:
      - |
        set -eu
        HOST="${KILL_SWITCH_HOST:-http://localhost:8080}"
        curl -sS -X POST "${HOST}/kill-switch/acknowledge" \
          -H "Authorization: Bearer ${KILL_SWITCH_TOKEN:-}"
        echo ""

  alert:ack:
    desc: 'Acknowledge a firing telemetry alert, silencing re-notification: task alert:ack ID=<id>. Host override via TELEMETRY_HOST (default http://localhost:8080).'
    cmds:
      - |
        set -eu
        ID="{{.ID | default ""}}"
        if [ -z "$ID" ]; then
          echo "usage: task alert:ack ID=<alert id>" >&2
          exit 1
        fi
        HOST="${TELEMETRY_HOST:-http://localhost:8080}"
        curl -sS -X POST "${HOST}/telemetry/alerts/${ID}/ack" \
          -H 'Content-Type: application/json' \
          -d '{"via": "cli"}'
        echo ""

  kill-switch:status:
    desc: 'Report the current kill-switch state (engaged, reason, source, ack-required). Host override via KILL_SWITCH_HOST.'
    cmds:
      - |
        set -eu
        HOST="${KILL_SWITCH_HOST:-http://localhost:8080}"
        curl -sS "${HOST}/kill-switch/status"
        echo ""

  app:dev:
    cmds:
      - './run-dev.sh'
    dir: cmd

  app:build:
    cmds:
      - 'docker build -t grodt/app:latest -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"

  app:logs:
    cmds:
      - 'stern grodt --container-state running'

  app:restart:
    cmds:
      - 'task app:stop'
      - 'task app:start'

  app:stop:
    cmds:
      - 'kubectl scale deployment grodt --replicas=0'

  app:update:
    cmds:
      - 'kubectl rollout restart deployment grodt'

  app:start:
    cmds:
      - 'kubectl scale deployment grodt --replicas=1'

  app:build-dev:
    cmds:
      - 'docker build -t grodt/app:latest-dev -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"
      
  app:deploy:
    cmds:
      - './deploy-app.sh {{.version}}'
    dir: "{{.ROOT_DIR}}"
    var:
      version: ""

  metrics:simulation:
    cmds:
      - '/Users/jamal/miniconda3/envs/trading/bin/python3 engine/trading_engine.py --sl-shift 1'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      BALANCE: "10000"
      SYMBOL: "NVDA"
      TWIRP_HOST: "http://45.77.223.21"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_open_strategy_v4"
      START_DATE: "2025-05-01"
      STOP_DATE: "2025-05-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      
  metrics:fetch:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://45.77.223.21 --from-date 2025-05-29 --to-date 2025-05-30'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:simulation:
    cmds:
        - './env/bin/python tools/playground_metrics.py --playground-id b2df3e33-b684-4d5e-b6d1-9d67f29f45cb --twirp-host http://localhost:5051 --from-date 2025-05-27 --to-date 2025-05-29'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:local:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://localhost:5051 --from-date 2025-05-16 --to-date 2025-05-17'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  esdb:pf:
    cmds:
      - 'kubectl port-forward svc/eventstoredb 2113:2113 -n eventstoredb'

  pg:pf:
    cmds:
      - 'kubectl port-forward svc/postgres 5432:5432 -n database'

  db:start:
    cmds:
      - 'docker-compose -f {{.ROOT_DIR}}/infra/docker-compose.yaml up'

  db:migrate:
    desc: "Apply database migrations (extensions, sequences, analytics views)"
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/infra/migrate.py'

  telemetry:status:
    desc: "Show current telemetry from the playground DB: heartbeat sources with staleness, the latest metric snapshot, and recent alerts (unacked flagged). Answers 'is the strategy actually running?'"
    cmds:
      - |
        set -eu
        PSQL="docker compose -f {{.ROOT_DIR}}/infra/docker-compose.yaml exec -T postgres psql -U grodt -d playground -v ON_ERROR_STOP=1"
        echo "=== Heartbeats ==="
        $PSQL -c "SELECT source_kind, name, EXTRACT(EPOCH FROM (now() - last_seen_at))::int AS seconds_since_beat, (now() - last_seen_at > interval '90 seconds') AS stale, beat_count FROM telemetry_heartbeats ORDER BY source_kind, name;"
        echo "=== Latest metric snapshot ==="
        $PSQL -c "SELECT name, labels, kind, value, recorded_at FROM telemetry_metrics WHERE recorded_at = (SELECT max(recorded_at) FROM telemetry_metrics) ORDER BY name;"
        echo "=== Recent alerts (UNACKED = firing and not acknowledged) ==="
        $PSQL -c "SELECT id, rule, subject, fired_at, CASE WHEN resolved_at IS NOT NULL THEN 'resolved' WHEN acked_at IS NOT NULL THEN 'acked via ' || acked_via ELSE 'UNACKED' END AS status, last_notified_at FROM telemetry_alerts ORDER BY id DESC LIMIT 10;"

  infra:status:
    desc: "Check production droplet status via DO MCP"
    cmds:
      - 'echo "Use DO MCP server: list droplets with tag grodt"'
      - 'echo "Or: doctl compute droplet list --tag-name grodt"'

  infra:destroy:
    desc: "Destroy production droplet and firewall (WARNING: destructive)"
    cmds:
      - 'echo "Use DO MCP server to destroy:"'
      - 'echo "  1. Delete droplet named grodt-prod"'
      - 'echo "  2. Delete firewall named grodt-prod-firewall"'
      - 'echo "Or: doctl compute droplet delete grodt-prod --force"'
      - 'echo "    doctl compute firewall delete <firewall-id>"'

  infra:rebuild:
    desc: "Destroy and reprovision production stack from scratch"
    cmds:
      - task infra:destroy
      - 'echo "Run /gsd:execute-phase 7 --wave 2 to reprovision via MCP"'

  infra:deploy:
    desc: "Deploy latest code to production droplet (override IP: task infra:deploy PROD_IP=x.x.x.x)"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'DEPLOY_SCRIPT'
        set -e
        cd /opt/slack-trading

        # Check for local changes that would block git pull
        DIRTY_FILES=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY_FILES" ]; then
          echo ""
          echo "=========================================="
          echo "  LOCAL CHANGES DETECTED ON PROD SERVER"
          echo "=========================================="
          echo ""
          echo "The following files have local modifications:"
          echo "$DIRTY_FILES" | sed 's/^/  - /'
          echo ""
          echo "Options:"
          echo "  1) Reset these files and continue deploy:"
          echo "     ssh root@$(hostname -I | awk '{print $1}') 'cd /opt/slack-trading && git checkout -- <file>'"
          echo "  2) Stash changes for later review:"
          echo "     ssh root@$(hostname -I | awk '{print $1}') 'cd /opt/slack-trading && git stash'"
          echo "  3) Force reset all local changes:"
          echo "     task infra:deploy:force"
          echo ""
          echo "Aborting deploy."
          exit 1
        fi

        git pull origin dev

        # Symlink .env -> .env.prod so docker-compose can interpolate variables
        ln -sf .env.prod .env

        docker compose -f docker-compose.prod.yaml up -d --build
        DEPLOY_SCRIPT

  infra:deploy:force:
    desc: "Deploy to production, discarding any local changes on the droplet"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'DEPLOY_SCRIPT'
        set -e
        cd /opt/slack-trading

        DIRTY_FILES=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY_FILES" ]; then
          echo "Resetting local changes:"
          echo "$DIRTY_FILES" | sed 's/^/  - /'
          git checkout -- .
        fi

        git pull origin dev

        # Symlink .env -> .env.prod so docker-compose can interpolate variables
        ln -sf .env.prod .env

        docker compose -f docker-compose.prod.yaml up -d --build
        DEPLOY_SCRIPT

  infra:verify:
    desc: "Verify production deployment: services healthy, git clean, and telemetry snapshots being written (fails if telemetry is stale)"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'VERIFY_SCRIPT'
        set -e
        cd /opt/slack-trading

        echo "=== Service Health ==="
        docker compose -f docker-compose.prod.yaml ps --format '{{`{{.Name}}`}} {{`{{.Status}}`}}'

        echo ""
        echo "=== Git Status ==="
        echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
        echo "Commit: $(git rev-parse --short HEAD) — $(git log -1 --format='%s')"
        DIRTY=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY" ]; then
          echo "WARNING: Local changes detected:"
          echo "$DIRTY" | sed 's/^/  - /'
        else
          echo "Clean (no local changes)"
        fi

        echo ""
        echo "=== Telemetry Freshness ==="
        # The snapshot writer flushes every TELEMETRY_SNAPSHOT_INTERVAL (60s
        # default); rows older than two intervals mean telemetry is not being
        # written — the exact failure the old stack could not surface.
        FRESH=$(docker compose -f docker-compose.prod.yaml exec -T postgres \
          psql -U grodt -d playground -tA \
          -c "SELECT count(*) FROM telemetry_metrics WHERE recorded_at > now() - interval '2 minutes';" 2>/dev/null || echo "ERR")
        if [ "$FRESH" = "ERR" ]; then
          echo "  FAIL  could not query telemetry_metrics (table missing or postgres down)"
          exit 1
        elif [ "$FRESH" -gt 0 ]; then
          echo "  OK  $FRESH metric rows written in the last 2 minutes"
        else
          echo "  FAIL  no telemetry snapshot in the last 2 minutes — is the server running?"
          exit 1
        fi

        UNACKED=$(docker compose -f docker-compose.prod.yaml exec -T postgres \
          psql -U grodt -d playground -tA \
          -c "SELECT count(*) FROM telemetry_alerts WHERE resolved_at IS NULL AND acked_at IS NULL;" 2>/dev/null || echo "0")
        if [ "$UNACKED" != "0" ]; then
          echo "  NOTE  $UNACKED unacknowledged alert(s) firing — run task telemetry:status"
        fi
        VERIFY_SCRIPT

  db:playgrounds:
    desc: "List all playgrounds with IDs, client IDs, and environment"
    vars:
      HOST: '{{.HOST | default "192.168.8.164"}}'
      DOCKER_CONTAINER: '{{.DOCKER_CONTAINER | default "infra-postgres-1"}}'
    cmds:
      - 'ssh jcole@{{.HOST}} "wsl -e bash -c \"docker exec {{.DOCKER_CONTAINER}} psql -U grodt -d playground -c ''SELECT id, client_id, environment, created_at FROM playground_sessions ORDER BY created_at DESC;''\""'

  db:playgrounds:prod:
    desc: "List all playgrounds on production droplet"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - 'ssh root@{{.PROD_IP}} "docker exec slack-trading-postgres-1 psql -U grodt -d playground -c ''SELECT id, client_id, environment, created_at FROM playground_sessions ORDER BY created_at DESC;''"'

  infra:logs:
    desc: "Stream production logs from all services"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - 'ssh root@{{.PROD_IP}} "cd /opt/slack-trading && docker compose -f docker-compose.prod.yaml logs -f"'

  gen:proto:
    cmds:
      - 'source {{.ROOT_DIR}}/src/clients/python/env/bin/activate'
      - 'protoc --proto_path={{.ROOT_DIR}}/src/go --go_out={{.ROOT_DIR}} --python_out={{.ROOT_DIR}}/src/clients/python --twirp_out={{.ROOT_DIR}} --twirpy_out={{.ROOT_DIR}}/src/clients/python {{.ROOT_DIR}}/src/go/playground.proto'
      - 'mv {{.ROOT_DIR}}/playground/playground.pb.go {{.ROOT_DIR}}/src/go/playground'
      - 'mv {{.ROOT_DIR}}/playground/playground.twirp.go {{.ROOT_DIR}}/src/go/playground'
      - 'rm -rf {{.ROOT_DIR}}/playground'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_pb2.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_twirp.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_pb2.py'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_twirp.py'

  optimize:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine_optimizer.py --max-open-count-lbound 2 --max-open-count-ubound 8 --target-risk-to-reward-lbound 0.8 --target-risk-to-reward-ubound 2.5 --max-per-trade-risk-percentage-lbound 0.005 --max-per-trade-risk-percentage-ubound 0.035 --n-calls 25'
    env:
      BALANCE: "15000"
      SYMBOL: "{{.SYMBOL}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      LIVE_ACCOUNT_TYPE: "simulation"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "25"
    vars:
      SYMBOL: ""

  sim:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine.py --max-open-count 4 --target-risk-to-reward 1.19 --max-per-trade-risk-percentage 0.02 --use-htf-data true'
    env:
      BALANCE: "20000"
      SYMBOL: "{{.symbol}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      REMOVE_PLAYGROUND_WHEN_DONE: "false"
    vars:
      symbol: ""
    dir: "{{.ROOT_DIR}}"

  # ─── V2 Strategy Commands (TradeSignal Framework) ──────────────────

  strategy:mean-reversion:
    desc: "Run MeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --balance {{.BALANCE}} {{if .PDF_PATH}}--pdf-path {{.PDF_PATH}}{{end}} {{if eq .SAVE_TO_DB "true"}}--save-to-db{{end}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      BALANCE: '{{.balance | default (.BALANCE | default "100000")}}'
      PDF_PATH: '{{.pdf_path | default (.PDF_PATH | default "")}}'
      SAVE_TO_DB: '{{.save_to_db | default (.SAVE_TO_DB | default "")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:live:
    desc: "Run MeanReversion V2 strategy in live mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --live --client-id {{.CLIENT_ID}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      TWIRP_HOST: "http://159.89.226.131:5051"
      TELEMETRY_HOST: "http://159.89.226.131:8080"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      CLIENT_ID: '{{.client_id | default (.CLIENT_ID | default (print "live-mean-reversion-" .SYMBOL))}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:replay:
    desc: "Run MeanReversion V2 with signal replay from ESDB (requires stream name)"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --replay-signals {{.STREAM}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      STREAM: '{{.stream | default (.STREAM | default "")}}'
    preconditions:
      - sh: '[ -n "{{.STREAM}}" ]'
        msg: |
          stream is required.
          task strategy:mean-reversion:replay stream=trade-signals
          task strategy:mean-reversion:replay stream=trade-signals-sim-<playground-id>

  strategy:covered-call:
    desc: "Run CoveredCall V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_covered_call_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:credit-spread:
    desc: "Run CreditSpread V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_credit_spread_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "SPY")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:wheel:
    desc: "Run Wheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:options-mean-reversion:
    desc: "Run OptionsMeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_options_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:pdf-wheel:
    desc: "Run PDFWheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_pdf_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  build:pdf:
    desc: "Build PDF from Polygon data (e.g. task build:pdf symbol=AAPL start=2025-03-01 end=2025-03-31)"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} tools/build_pdf_from_polygon.py --strategy {{.STRATEGY}} --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --output {{.OUTPUT}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      STRATEGY: '{{.strategy | default (.STRATEGY | default "mean_reversion")}}'
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      OUTPUT: '{{.output | default (.OUTPUT | default (print "models/" .SYMBOL "_" .STRATEGY "_" .START "_" .END "_pdf.json"))}}'

