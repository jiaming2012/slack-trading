version: '3'

vars:
  CONDA_BASE:
    sh: conda info --base
  PYTHON: '{{.CONDA_BASE}}/envs/grodt/bin/python'

tasks:
  clean:vultr:
    cmds:
      - './cleanup_docker_images_remote.sh'
    dir: "{{.ROOT_DIR}}"

  clean:docker:
    cmds:
      - './cleanup_old_docker_images.sh'
      - 'docker volume prune -f'
    dir: "{{.ROOT_DIR}}"

  env:generate:
    cmds:
      - 'rm -f .env.machine'
      - 'touch .env.machine'
      - 'echo TRADING_PROJECT_DIR=\"{{.ROOT_DIR}}\" >> .env.machine'
      - 'echo ANACONDA_HOME=\"$(conda info --base)\" >> .env.machine'
    dir: "{{.ROOT_DIR}}"

  conda:activate:
    cmds:
      - 'conda activate grodt'
    dir: "{{.ROOT_DIR}}"

  conda:init:
    cmds:
      - 'task env:generate'
      - 'rm -f miniconda3'
      - 'ln -s $(conda info --base) miniconda3'
    dir: "{{.ROOT_DIR}}"

  conda:create:
    cmds:
      - 'conda env create -f grodt.yml'
    dir: "{{.ROOT_DIR}}"

  conda:list:
    cmds:
      - 'conda env list'

  conda:update:
    cmds:
      - 'conda env update -f grodt.yml --name trading --prune'
    dir: "{{.ROOT_DIR}}"

  conda:export:
    cmds:
      - 'conda update --all'
      - 'conda env export > conda-env-trading.yaml'
    dir: "{{.ROOT_DIR}}"

  list:
    cmds:
      - 'task --list-all'

  rc:
    cmds:
      - 'mosh root@149.28.225.5'

  python:install:
    cmds:
      - 'rm -rf env'
      - 'python3.10 -m venv env'
      - 'task python:upgrade'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  python:upgrade:
    cmds:
      - 'pip install --upgrade pip'
      - 'pip install -r requirements.txt'
    dir: "{{.ROOT_DIR}}/src/clients/python"

  test:
    cmds:
      - 'go test -count=1 ./...'
    dir: src/go/backtester
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:model-diff:
    desc: 'MIG-03: run the fixed AAPL model-diff backtester scenario and diff its output byte-for-byte against the committed baseline reference (reconcile-models-packages G4). Requires the Go trading server to be running (task app:dev).'
    cmds:
      - |
        set -euo pipefail
        HOST="${TWIRP_HOST:-http://127.0.0.1:5051}"
        HOST_PORT="${HOST#http://}"
        HOST_PORT="${HOST_PORT#https://}"
        HOST_ONLY="${HOST_PORT%%:*}"
        PORT_ONLY="${HOST_PORT##*:}"
        if ! nc -z "$HOST_ONLY" "$PORT_ONLY" 2>/dev/null; then
          echo "ERROR: Go trading server is not reachable at ${HOST}. Start it first: task app:dev" >&2
          exit 1
        fi

        SCENARIO_NAME="aapl-2025-01-06_2025-01-10"
        REFERENCE="{{.ROOT_DIR}}/src/clients/python/tests/baselines/model-diff-reference.txt"
        OUT="$(mktemp)"
        trap 'rm -f "$OUT"' EXIT

        OTEL_SDK_DISABLED=true {{.PYTHON}} -m tests.model_diff_scenario --twirp-host "$HOST" --output "$OUT"

        if ! diff -u "$REFERENCE" "$OUT"; then
          echo "" >&2
          echo "test:model-diff FAILED — scenario '${SCENARIO_NAME}' output differs from the baseline reference (${REFERENCE})" >&2
          exit 1
        fi

        echo "test:model-diff PASSED — scenario '${SCENARIO_NAME}' matches the baseline reference byte-for-byte."
    dir: src/clients/python

  test:trading-stack:
    desc: 'Run the tradingstack package testcontainers round-trip suite (requires Docker)'
    cmds:
      - 'go test -count=1 ./src/go/tradingstack/...'
    dir: "{{.ROOT_DIR}}"
    env:
      TRADING_PROJECT_DIR: "{{.ROOT_DIR}}"

  test:e2e:
    cmds:
      - task app:build-dev
      - task test:e2e:live-account-cancel-order
      - task test:e2e:live-account-close-duplicate-canceled
      - task test:e2e:live-account-close-duplicate-rejected
      - task test:e2e:live-account-close
      - task test:e2e:live-account-close-with-id
      - task test:e2e:live-account-duplicate-orders
      - task test:e2e:live-account-filled
      - task test:e2e:live-account-get-open-orders
      - task test:e2e:live-account-multiple-open-rejected
      - task test:e2e:live-account-multiple-open
      - task test:e2e:live-account-multiple-playgrounds
      - task test:e2e:live-account-reject-order
      - task test:e2e:simulate-options
      - task test:e2e:live-account-simulate-options
      - task test:e2e:trace-id
      - task test:e2e:otel-candle-metrics
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:otel-candle-metrics:
    cmds:
      - 'go test -tags integration -timeout 180s -v -count=1 -run ^TestLiveCandleMetricPipeline$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:tradier-place-spread:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestTradierPlaceSpread$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-simulate-options:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-get-open-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountGetOpenOrders$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-multiple-open-rejected:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountMultipleOpenRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-with-id:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCloseWithID$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-filled:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountFilled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close:
    cmds:
      - 'go test -timeout 90s -count=1 -run ^TestLiveAccountClose$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"
  
  test:e2e:live-account-multiple-playgrounds:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountMultiplePlaygrounds$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-duplicate-orders:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountDuplicateOrdersTest$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-duplicate-rejected:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateRejected$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-close-duplicate-canceled:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountCloseDuplicateCanceled$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:live-account-multiple-open:
    cmds:
      - 'go test -timeout 120s -count=1 -run ^TestLiveAccountMultipleOpen$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing" 

  test:e2e:live-account-reject-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountRejectOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing" 

  test:e2e:live-account-cancel-order:
    cmds:
      - 'go test -timeout 60s -count=1 -run ^TestLiveAccountCancelOrder$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"
  
  test:e2e:simulate-options:
    cmds:
      - 'go test -timeout 60s -v -count=1 -run ^TestSimulateOptions$ github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  test:e2e:trace-id:
    cmds:
      - 'go test -tags integration -timeout 120s -v -count=1 -run ^TestTraceId github.com/jiaming2012/slack-trading/integration_testing'
    dir: "{{.ROOT_DIR}}/integration_testing"

  metrics:token:
    cmds:
      - 'kubectl -n kubernetes-dashboard create token --duration=24h dashboard-admin'

  test:integration:
    cmds:
      # - 'go run main.go'
      - 'go test ./...'
    dir: "{{.ROOT_DIR}}/src/go/marketdata/integration_tests"

  commit:
    cmds:
      - 'task test'
      - 'git add .'
      - 'git commit -m "{{.CLI_ARGS}}"'
      - 'git push'
      
  app:dev:
    cmds:
      - './run-dev.sh'
    dir: cmd

  app:build:
    cmds:
      - 'docker build -t grodt/app:latest -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"

  app:logs:
    cmds:
      - 'stern grodt --container-state running'

  app:restart:
    cmds:
      - 'task app:stop'
      - 'task app:start'

  app:stop:
    cmds:
      - 'kubectl scale deployment grodt --replicas=0'

  app:update:
    cmds:
      - 'kubectl rollout restart deployment grodt'

  app:start:
    cmds:
      - 'kubectl scale deployment grodt --replicas=1'

  app:build-dev:
    cmds:
      - 'docker build -t grodt/app:latest-dev -f Dockerfile .'
    dir: "{{.ROOT_DIR}}"
      
  app:deploy:
    cmds:
      - './deploy-app.sh {{.version}}'
    dir: "{{.ROOT_DIR}}"
    var:
      version: ""

  metrics:simulation:
    cmds:
      - '/Users/jamal/miniconda3/envs/trading/bin/python3 engine/trading_engine.py --sl-shift 1'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      BALANCE: "10000"
      SYMBOL: "NVDA"
      TWIRP_HOST: "http://45.77.223.21"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_open_strategy_v4"
      START_DATE: "2025-05-01"
      STOP_DATE: "2025-05-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      
  metrics:fetch:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://45.77.223.21 --from-date 2025-05-29 --to-date 2025-05-30'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:simulation:
    cmds:
        - './env/bin/python tools/playground_metrics.py --playground-id b2df3e33-b684-4d5e-b6d1-9d67f29f45cb --twirp-host http://localhost:5051 --from-date 2025-05-27 --to-date 2025-05-29'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  metrics:fetch:local:
    cmds:
      - './env/bin/python tools/playground_metrics.py --tags cli_v14 --twirp-host http://localhost:5051 --from-date 2025-05-16 --to-date 2025-05-17'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    var:
      tags: ""

  esdb:pf:
    cmds:
      - 'kubectl port-forward svc/eventstoredb 2113:2113 -n eventstoredb'

  pg:pf:
    cmds:
      - 'kubectl port-forward svc/postgres 5432:5432 -n database'

  db:start:
    cmds:
      - 'docker-compose -f {{.ROOT_DIR}}/infra/docker-compose.yaml up'

  db:migrate:
    desc: "Apply database migrations (extensions, sequences, analytics views)"
    cmds:
      - '{{.PYTHON}} {{.ROOT_DIR}}/infra/migrate.py'

  observability:start:
    desc: "Start observability stack (Grafana, Tempo, Loki, Prometheus, OTel Collector)"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml up -d'
    dir: "{{.ROOT_DIR}}"

  observability:stop:
    desc: "Stop observability stack"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml down'
    dir: "{{.ROOT_DIR}}"

  observability:logs:
    desc: "Show observability stack logs"
    cmds:
      - 'docker compose -f observability/docker-compose.yaml logs -f'
    dir: "{{.ROOT_DIR}}"

  infra:status:
    desc: "Check production droplet status via DO MCP"
    cmds:
      - 'echo "Use DO MCP server: list droplets with tag grodt"'
      - 'echo "Or: doctl compute droplet list --tag-name grodt"'

  infra:destroy:
    desc: "Destroy production droplet and firewall (WARNING: destructive)"
    cmds:
      - 'echo "Use DO MCP server to destroy:"'
      - 'echo "  1. Delete droplet named grodt-prod"'
      - 'echo "  2. Delete firewall named grodt-prod-firewall"'
      - 'echo "Or: doctl compute droplet delete grodt-prod --force"'
      - 'echo "    doctl compute firewall delete <firewall-id>"'

  infra:rebuild:
    desc: "Destroy and reprovision production stack from scratch"
    cmds:
      - task infra:destroy
      - 'echo "Run /gsd:execute-phase 7 --wave 2 to reprovision via MCP"'

  infra:deploy:
    desc: "Deploy latest code to production droplet (override IP: task infra:deploy PROD_IP=x.x.x.x)"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'DEPLOY_SCRIPT'
        set -e
        cd /opt/slack-trading

        # Check for local changes that would block git pull
        DIRTY_FILES=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY_FILES" ]; then
          echo ""
          echo "=========================================="
          echo "  LOCAL CHANGES DETECTED ON PROD SERVER"
          echo "=========================================="
          echo ""
          echo "The following files have local modifications:"
          echo "$DIRTY_FILES" | sed 's/^/  - /'
          echo ""
          echo "Options:"
          echo "  1) Reset these files and continue deploy:"
          echo "     ssh root@$(hostname -I | awk '{print $1}') 'cd /opt/slack-trading && git checkout -- <file>'"
          echo "  2) Stash changes for later review:"
          echo "     ssh root@$(hostname -I | awk '{print $1}') 'cd /opt/slack-trading && git stash'"
          echo "  3) Force reset all local changes:"
          echo "     task infra:deploy:force"
          echo ""
          echo "Aborting deploy."
          exit 1
        fi

        git pull origin dev

        # Symlink .env -> .env.prod so docker-compose can interpolate variables
        ln -sf .env.prod .env

        docker compose -f docker-compose.prod.yaml up -d --build
        DEPLOY_SCRIPT

  infra:deploy:force:
    desc: "Deploy to production, discarding any local changes on the droplet"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'DEPLOY_SCRIPT'
        set -e
        cd /opt/slack-trading

        DIRTY_FILES=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY_FILES" ]; then
          echo "Resetting local changes:"
          echo "$DIRTY_FILES" | sed 's/^/  - /'
          git checkout -- .
        fi

        git pull origin dev

        # Symlink .env -> .env.prod so docker-compose can interpolate variables
        ln -sf .env.prod .env

        docker compose -f docker-compose.prod.yaml up -d --build
        DEPLOY_SCRIPT

  infra:verify:
    desc: "Verify production deployment matches local dashboards and services are healthy"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
      GF_PASS:
        sh: 'ssh root@{{.PROD_IP}} "grep GF_ADMIN_PASSWORD /opt/slack-trading/.env.prod 2>/dev/null | cut -d= -f2" 2>/dev/null || echo "admin"'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'VERIFY_SCRIPT'
        set -e
        cd /opt/slack-trading

        GF_PASS=$(grep GF_ADMIN_PASSWORD .env.prod 2>/dev/null | cut -d= -f2)
        GF_PASS=${GF_PASS:-admin}

        echo "=== Service Health ==="
        docker compose -f docker-compose.prod.yaml ps --format '{{`{{.Name}}`}} {{`{{.Status}}`}}'

        echo ""
        echo "=== Git Status ==="
        echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
        echo "Commit: $(git rev-parse --short HEAD) — $(git log -1 --format='%s')"
        DIRTY=$(git diff --name-only 2>/dev/null)
        if [ -n "$DIRTY" ]; then
          echo "WARNING: Local changes detected:"
          echo "$DIRTY" | sed 's/^/  - /'
        else
          echo "Clean (no local changes)"
        fi

        echo ""
        echo "=== Dashboard Verification ==="
        DASHBOARDS="grodt-live-sim grodt-covered-call grodt-mean-reversion"
        ALL_OK=true
        for DASH_UID in $DASHBOARDS; do
          # Get file checksum (normalize: remove whitespace)
          case "$DASH_UID" in
            grodt-live-sim) FILE="observability/dashboards/grodt-live-simulation.json" ;;
            grodt-covered-call) FILE="observability/dashboards/grodt-covered-call.json" ;;
            grodt-mean-reversion) FILE="observability/dashboards/grodt-mean-reversion.json" ;;
          esac

          # Get panel count from file
          FILE_PANELS=$(python3 -c "import json; d=json.load(open('$FILE')); print(len(d.get('panels',[])))" 2>/dev/null || echo "?")

          # Get panel count and version from Grafana API
          API_RESPONSE=$(curl -s -u "admin:$GF_PASS" "http://localhost:3000/api/dashboards/uid/$DASH_UID" 2>/dev/null)
          API_PANELS=$(echo "$API_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('dashboard',{}).get('panels',[])))" 2>/dev/null || echo "?")
          API_VERSION=$(echo "$API_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('dashboard',{}).get('version','?'))" 2>/dev/null || echo "?")

          # Compare a sample query from file vs API
          FILE_SAMPLE=$(python3 -c "
        import json
        d=json.load(open('$FILE'))
        for p in d.get('panels',[]):
            for t in p.get('targets',[]):
                if 'expr' in t:
                    print(t['expr'][:60])
                    break
            else: continue
            break
        " 2>/dev/null || echo "?")

          API_SAMPLE=$(echo "$API_RESPONSE" | python3 -c "
        import sys,json
        d=json.load(sys.stdin).get('dashboard',{})
        for p in d.get('panels',[]):
            for t in p.get('targets',[]):
                if 'expr' in t:
                    print(t['expr'][:60])
                    break
            else: continue
            break
        " 2>/dev/null || echo "?")

          if [ "$FILE_PANELS" = "$API_PANELS" ] && [ "$FILE_SAMPLE" = "$API_SAMPLE" ]; then
            echo "  OK  $DASH_UID (v$API_VERSION, $API_PANELS panels)"
          else
            echo "  STALE  $DASH_UID — Grafana has v$API_VERSION ($API_PANELS panels), file has $FILE_PANELS panels"
            echo "         Run: task infra:refresh-dashboards"
            ALL_OK=false
          fi
        done

        if [ "$ALL_OK" = "false" ]; then
          echo ""
          echo "WARNING: Some dashboards are stale. Grafana caches provisioned dashboards."
          exit 1
        fi

        echo ""
        echo "=== OTel Collector ==="
        if curl -s -o /dev/null -w '%{http_code}' http://localhost:4318/ | grep -q '200\|404\|405'; then
          echo "  OK  OTLP HTTP (port 4318) accepting connections"
        else
          echo "  DOWN  OTLP HTTP (port 4318) not responding"
        fi
        VERIFY_SCRIPT

  infra:refresh-dashboards:
    desc: "Force Grafana to re-read dashboards from provisioned files (recreates otel-lgtm volume)"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - |
        ssh root@{{.PROD_IP}} bash -s <<'REFRESH_SCRIPT'
        set -e
        cd /opt/slack-trading
        echo "Recreating otel-lgtm with fresh Grafana DB..."
        docker compose -f docker-compose.prod.yaml stop otel-lgtm
        docker compose -f docker-compose.prod.yaml rm -f otel-lgtm
        docker volume rm slack-trading_otel-lgtm-data 2>/dev/null || true
        docker compose -f docker-compose.prod.yaml up -d otel-lgtm
        echo "Waiting for Grafana to start..."
        sleep 15
        GF_PASS=$(grep GF_ADMIN_PASSWORD .env.prod 2>/dev/null | cut -d= -f2)
        GF_PASS=${GF_PASS:-admin}
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$GF_PASS" http://localhost:3000/api/health)
        if [ "$STATUS" = "200" ]; then
          echo "Grafana is up. Dashboards re-provisioned from files."
        else
          echo "WARNING: Grafana returned HTTP $STATUS"
        fi
        REFRESH_SCRIPT

  db:playgrounds:
    desc: "List all playgrounds with IDs, client IDs, and environment"
    vars:
      HOST: '{{.HOST | default "192.168.8.164"}}'
      DOCKER_CONTAINER: '{{.DOCKER_CONTAINER | default "infra-postgres-1"}}'
    cmds:
      - 'ssh jcole@{{.HOST}} "wsl -e bash -c \"docker exec {{.DOCKER_CONTAINER}} psql -U grodt -d playground -c ''SELECT id, client_id, environment, created_at FROM playground_sessions ORDER BY created_at DESC;''\""'

  db:playgrounds:prod:
    desc: "List all playgrounds on production droplet"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - 'ssh root@{{.PROD_IP}} "docker exec slack-trading-postgres-1 psql -U grodt -d playground -c ''SELECT id, client_id, environment, created_at FROM playground_sessions ORDER BY created_at DESC;''"'

  infra:logs:
    desc: "Stream production logs from all services"
    vars:
      PROD_IP: '{{.PROD_IP | default "159.89.226.131"}}'
    cmds:
      - 'ssh root@{{.PROD_IP}} "cd /opt/slack-trading && docker compose -f docker-compose.prod.yaml logs -f"'

  gen:proto:
    cmds:
      - 'source {{.ROOT_DIR}}/src/clients/python/env/bin/activate'
      - 'protoc --proto_path={{.ROOT_DIR}}/src/go --go_out={{.ROOT_DIR}} --python_out={{.ROOT_DIR}}/src/clients/python --twirp_out={{.ROOT_DIR}} --twirpy_out={{.ROOT_DIR}}/src/clients/python {{.ROOT_DIR}}/src/go/playground.proto'
      - 'mv {{.ROOT_DIR}}/playground/playground.pb.go {{.ROOT_DIR}}/src/go/playground'
      - 'mv {{.ROOT_DIR}}/playground/playground.twirp.go {{.ROOT_DIR}}/src/go/playground'
      - 'rm -rf {{.ROOT_DIR}}/playground'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_pb2.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'mv {{.ROOT_DIR}}/src/clients/python/playground_twirp.py {{.ROOT_DIR}}/src/clients/python/rpc'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_pb2.py'
      - 'rm -rf {{.ROOT_DIR}}/src/clients/python/playground_twirp.py'

  optimize:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine_optimizer.py --max-open-count-lbound 2 --max-open-count-ubound 8 --target-risk-to-reward-lbound 0.8 --target-risk-to-reward-ubound 2.5 --max-per-trade-risk-percentage-lbound 0.005 --max-per-trade-risk-percentage-ubound 0.035 --n-calls 25'
    env:
      BALANCE: "15000"
      SYMBOL: "{{.SYMBOL}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      LIVE_ACCOUNT_TYPE: "simulation"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "25"
    vars:
      SYMBOL: ""

  sim:
    cmds:
      - 'miniconda3/envs/trading/bin/python src/clients/python/engine/trading_engine.py --max-open-count 4 --target-risk-to-reward 1.19 --max-per-trade-risk-percentage 0.02 --use-htf-data true'
    env:
      BALANCE: "20000"
      SYMBOL: "{{.symbol}}"
      TWIRP_HOST: "http://localhost:5051"
      PLAYGROUND_ENV: "simulator"
      OPEN_STRATEGY: "simple_stack_open_strategy_v2"
      START_DATE: "2025-01-01"
      STOP_DATE: "2025-04-30"
      MODEL_UPDATE_FREQUENCY: "daily"
      OPTIMIZER_UPDATE_FREQUENCY: "weekly"
      N_CALLS: "30"
      REMOVE_PLAYGROUND_WHEN_DONE: "false"
    vars:
      symbol: ""
    dir: "{{.ROOT_DIR}}"

  # ─── V2 Strategy Commands (TradeSignal Framework) ──────────────────

  strategy:mean-reversion:
    desc: "Run MeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --balance {{.BALANCE}} {{if .PDF_PATH}}--pdf-path {{.PDF_PATH}}{{end}} {{if eq .SAVE_TO_DB "true"}}--save-to-db{{end}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://192.168.8.164:4318"
      OTEL_SERVICE_NAME: "grodt-strategy"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      BALANCE: '{{.balance | default (.BALANCE | default "100000")}}'
      PDF_PATH: '{{.pdf_path | default (.PDF_PATH | default "")}}'
      SAVE_TO_DB: '{{.save_to_db | default (.SAVE_TO_DB | default "")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:live:
    desc: "Run MeanReversion V2 strategy in live mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --live --client-id {{.CLIENT_ID}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://192.168.8.164:4318"
      OTEL_SERVICE_NAME: "grodt-strategy"
      TWIRP_HOST: "http://159.89.226.131:5051"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      CLIENT_ID: '{{.client_id | default (.CLIENT_ID | default (print "live-mean-reversion-" .SYMBOL))}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:mean-reversion:replay:
    desc: "Run MeanReversion V2 with signal replay from ESDB (requires stream name)"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --replay-signals {{.STREAM}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      STREAM: '{{.stream | default (.STREAM | default "")}}'
    preconditions:
      - sh: '[ -n "{{.STREAM}}" ]'
        msg: |
          stream is required.
          task strategy:mean-reversion:replay stream=trade-signals
          task strategy:mean-reversion:replay stream=trade-signals-sim-<playground-id>

  strategy:covered-call:
    desc: "Run CoveredCall V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_covered_call_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:credit-spread:
    desc: "Run CreditSpread V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_credit_spread_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "SPY")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:wheel:
    desc: "Run Wheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:options-mean-reversion:
    desc: "Run OptionsMeanReversion V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_options_mean_reversion_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "COIN")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  strategy:pdf-wheel:
    desc: "Run PDFWheel V2 strategy in simulation mode"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} demos/demo_pdf_wheel_v2.py --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} {{.EXTRA}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      EXTRA: '{{.extra | default (.EXTRA | default "")}}'

  build:pdf:
    desc: "Build PDF from Polygon data (e.g. task build:pdf symbol=AAPL start=2025-03-01 end=2025-03-31)"
    cmds:
      - 'PYTHONPATH=. {{.PYTHON}} tools/build_pdf_from_polygon.py --strategy {{.STRATEGY}} --symbol {{.SYMBOL}} --start {{.START}} --end {{.END}} --output {{.OUTPUT}}'
    dir: "{{.ROOT_DIR}}/src/clients/python"
    vars:
      STRATEGY: '{{.strategy | default (.STRATEGY | default "mean_reversion")}}'
      SYMBOL: '{{.symbol | default (.SYMBOL | default "AAPL")}}'
      START: '{{.start | default (.START | default "2025-01-01")}}'
      END: '{{.end | default (.END | default "2025-04-30")}}'
      OUTPUT: '{{.output | default (.OUTPUT | default (print "models/" .SYMBOL "_" .STRATEGY "_" .START "_" .END "_pdf.json"))}}'

  # ─── Metabase ──────────────────────────────────────────────────────

  metabase:provision:
    desc: "Provision all Metabase dashboards (5 dashboards, 24 cards)"
    cmds:
      - '{{.PYTHON}} infra/provision-metabase.py --url {{.url}} --user {{.user}} --password {{.password}}'
    dir: "{{.ROOT_DIR}}"
    vars:
      url: "http://192.168.8.164:3001"
      user: "jac475@cornell.edu"
      password: ""

  metabase:schema:
    desc: "Apply analytics schema (indexes, views, backtest_runs table)"
    cmds:
      - 'PGPASSWORD={{.password}} psql -h {{.host}} -U grodt -d playground -f infra/analytics-schema.sql'
    dir: "{{.ROOT_DIR}}"
    vars:
      host: "159.89.226.131"
      password: ""