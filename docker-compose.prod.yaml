# Production Docker Compose - Full trading + observability stack
# Usage: docker compose -f docker-compose.prod.yaml up -d --build
# Requires: .env.prod (copy from .env.prod.template and fill in secrets)

services:
  # --- Databases ---
  eventstore.db:
    image: eventstore/eventstore:24.2.0-jammy
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_INT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - type: volume
        source: eventstore-volume-data
        target: /var/lib/eventstore
      - type: volume
        source: eventstore-volume-logs
        target: /var/log/eventstore
    restart: unless-stopped

  postgres:
    image: postgres:13
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: postgres-volume-data
        target: /var/lib/postgresql/data
    restart: unless-stopped

  # --- Observability ---
  # otel-lgtm moved to Windows desktop (Tailscale IP: 100.70.200.55)
  # Grafana: http://100.70.200.55:3000
  # OTel collector: http://100.70.200.55:4318

  # --- Trading App ---
  grodt:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - eventstore.db
    env_file:
      - .env.prod
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://100.70.200.55:4318
    ports:
      - "8080:8080"    # REST API
      - "5051:5051"    # Twirp RPC
    restart: unless-stopped

volumes:
  eventstore-volume-data:
  eventstore-volume-logs:
  postgres-volume-data:
